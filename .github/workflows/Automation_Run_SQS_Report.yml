name: SQS Report During Automation Run

on:
  # schedule:
    # Runs at 9:15 AM IST (3:45 AM UTC) every day
    #  - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date (dd-mm-yyyy) or leave empty for today'
        required: false
        type: string
      from_date:
        description: 'Start date for range (dd-mm-yyyy)'
        required: false
        type: string
      to_date:
        description: 'End date for range (dd-mm-yyyy)'
        required: false
        type: string
      start_time:
        description: 'Start time (HH:MM format, e.g., 01:00)'
        required: false
        type: string
        default: '01:00'
      end_time:
        description: 'End time (HH:MM format, e.g., 07:30)'
        required: false
        type: string
        default: '07:30'
      granularity:
        description: 'Time window granularity in minutes (e.g., 30, 60)'
        required: false
        type: string
        default: '30'

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pandas pytz openpyxl
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
        
    - name: Generate SQS Report
      id: generate_report
      run: |
        # Build command with time parameters
        BASE_CMD="python .github/scripts/sqs_analysis_for_all_nonprodqa.py"
        TIME_PARAMS=""

        # Add time parameters if provided
        if [ -n "${{ github.event.inputs.start_time }}" ]; then
          TIME_PARAMS="$TIME_PARAMS --start-time '${{ github.event.inputs.start_time }}'"
        fi
        if [ -n "${{ github.event.inputs.end_time }}" ]; then
          TIME_PARAMS="$TIME_PARAMS --end-time '${{ github.event.inputs.end_time }}'"
        fi
        if [ -n "${{ github.event.inputs.granularity }}" ]; then
          TIME_PARAMS="$TIME_PARAMS --granularity ${{ github.event.inputs.granularity }}"
        fi

        # Determine the command to run based on inputs
        if [ -n "${{ github.event.inputs.date }}" ]; then
          eval "$BASE_CMD '${{ github.event.inputs.date }}' $TIME_PARAMS"
        elif [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
          eval "$BASE_CMD --from '${{ github.event.inputs.from_date }}' --to '${{ github.event.inputs.to_date }}' $TIME_PARAMS"
        else
          # Default: run for today
          eval "$BASE_CMD $TIME_PARAMS"
        fi

        # List all generated files for debugging
        echo "=== Generated files ==="
        ls -la sqs_report*.* || echo "No report files found"

        # Find the main HTML file (no longer generating separate email version)
        HTML_FILE=$(ls sqs_report_*.html 2>/dev/null | head -1)
        EXCEL_FILE=$(ls sqs_report_*.xlsx 2>/dev/null | head -1)

        if [ -n "$HTML_FILE" ] && [ -f "$HTML_FILE" ]; then
          echo "Found HTML file: $HTML_FILE"
          echo "html_file=$HTML_FILE" >> $GITHUB_OUTPUT

          # Copy the HTML file to the expected location for email
          cp "$HTML_FILE" email_content.html
          echo "Email content ready: $HTML_FILE"

          # Show file size for verification
          echo "HTML file size: $(wc -c < "$HTML_FILE") bytes"
          echo "First few lines of content:"
          head -10 "$HTML_FILE"
        else
          echo "Error: No HTML file found"
          echo "Available files:"
          ls -la *.html 2>/dev/null || echo "No HTML files at all"
          exit 1
        fi

        if [ -n "$EXCEL_FILE" ] && [ -f "$EXCEL_FILE" ]; then
          echo "Found Excel file: $EXCEL_FILE"
          echo "excel_file=$EXCEL_FILE" >> $GITHUB_OUTPUT
          echo "Excel file size: $(wc -c < "$EXCEL_FILE") bytes"
        else
          echo "Warning: No Excel file found"
        fi

    - name: Verify Email Content
      run: |
        echo "=== Verifying email content ==="
        if [ -f "email_content.html" ]; then
          echo "Email content file exists"
          echo "File size: $(wc -c < email_content.html) bytes"
          echo "Line count: $(wc -l < email_content.html) lines"

          # Count how many queue rows are in the HTML
          QUEUE_COUNT=$(grep -c 'class="queue-name"' email_content.html || echo "0")
          echo "Number of queue rows found: $QUEUE_COUNT"

          # Show a sample of queue names from the HTML
          echo "Sample queue names:"
          grep -o 'class="queue-name">[^<]*' email_content.html | head -5 | sed 's/.*">/- /' || echo "No queue names found"

          echo "Last few queue names:"
          grep -o 'class="queue-name">[^<]*' email_content.html | tail -5 | sed 's/.*">/- /' || echo "No queue names found"
        else
          echo "ERROR: email_content.html file not found!"
          ls -la *.html
        fi

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.GMAIL_USERNAME }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: "SQS Report - ${{ steps.generate_report.outputs.formatted_date }}"
        to: balakrishnam@bidgely.com
        from: ${{ secrets.GMAIL_USERNAME }}
        html_body: file://email_content.html
        attachments: ${{ steps.generate_report.outputs.excel_file }}

    - name: Clean up generated files
      run: |
        echo "Cleaning up generated files..."
        rm -f sqs_report_*.html
        rm -f sqs_report_*.xlsx
        rm -f email_content.html
        echo "Generated files deleted successfully"
