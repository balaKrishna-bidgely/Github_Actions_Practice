name: SQS Report During Automation Run

on:
  schedule:
    # Runs at 9:15 AM IST (3:45 AM UTC) every day
     - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date (dd-mm-yyyy) or leave empty for today'
        required: false
        type: string
      from_date:
        description: 'Start date for range (dd-mm-yyyy)'
        required: false
        type: string
      to_date:
        description: 'End date for range (dd-mm-yyyy)'
        required: false
        type: string

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pandas pytz
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
        
    - name: Generate SQS Report
      id: generate_report
      run: |
        # Determine the command to run based on inputs
        if [ -n "${{ github.event.inputs.date }}" ]; then
          python .github/scripts/sqs_analysis_for_all_nonprodqa.py "${{ github.event.inputs.date }}"
        elif [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
          python .github/scripts/sqs_analysis_for_all_nonprodqa.py --from "${{ github.event.inputs.from_date }}" --to "${{ github.event.inputs.to_date }}"
        else
          # Default: run for today
          python .github/scripts/sqs_analysis_for_all_nonprodqa.py
        fi

        # List all generated files for debugging
        echo "=== Generated files ==="
        ls -la sqs_report*.html || echo "No HTML files found"

        # Find the main HTML file (no longer generating separate email version)
        HTML_FILE=$(ls sqs_report_*.html 2>/dev/null | head -1)

        if [ -n "$HTML_FILE" ] && [ -f "$HTML_FILE" ]; then
          echo "Found HTML file: $HTML_FILE"
          echo "html_file=$HTML_FILE" >> $GITHUB_OUTPUT

          # Copy the HTML file to the expected location for email
          cp "$HTML_FILE" email_content.html
          echo "Email content ready: $HTML_FILE"

          # Show file size for verification
          echo "HTML file size: $(wc -c < "$HTML_FILE") bytes"
          echo "First few lines of content:"
          head -10 "$HTML_FILE"
        else
          echo "Error: No HTML file found"
          echo "Available files:"
          ls -la *.html 2>/dev/null || echo "No HTML files at all"
          exit 1
        fi

    - name: Verify Email Content
      run: |
        echo "=== Verifying email content ==="
        if [ -f "email_content.html" ]; then
          echo "Email content file exists"
          echo "File size: $(wc -c < email_content.html) bytes"
          echo "Line count: $(wc -l < email_content.html) lines"

          # Count how many queue rows are in the HTML
          QUEUE_COUNT=$(grep -c 'class="queue-name"' email_content.html || echo "0")
          echo "Number of queue rows found: $QUEUE_COUNT"

          # Show a sample of queue names from the HTML
          echo "Sample queue names:"
          grep -o 'class="queue-name">[^<]*' email_content.html | head -5 | sed 's/.*">/- /' || echo "No queue names found"

          echo "Last few queue names:"
          grep -o 'class="queue-name">[^<]*' email_content.html | tail -5 | sed 's/.*">/- /' || echo "No queue names found"
        else
          echo "ERROR: email_content.html file not found!"
          ls -la *.html
        fi

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.GMAIL_USERNAME }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: "SQS Report - ${{ github.event.inputs.date || 'Today' }}"
        to: balakrishnam@bidgely.com, chaitanyak@bidgely.com
        from: ${{ secrets.GMAIL_USERNAME }}
        html_body: file://email_content.html

    - name: Clean up HTML files
      run: |
        echo "Cleaning up generated HTML files..."
        rm -f sqs_report_*.html
        rm -f email_content.html
        echo "HTML files deleted successfully"
